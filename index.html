<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style2.css">
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <title>Aadarsh Shah</title>
    <style>
        :root {
            font-family: Inter, sans-serif;
            font-feature-settings: 'liga' 1, 'calt' 1;
        }

        @supports (font-variation-settings: normal) {
            :root {
                font-family: InterVariable, sans-serif;
            }
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            background: radial-gradient(600px at 447px 329px, rgba(16, 78, 216, 0.15), transparent 80%);
            background-color: #10172f;
            background-attachment: fixed;
        }

        p {
            font-family: "Inter", sans-serif;
            padding: 25px;
            color: white;
            margin: 0 0 30px 0;
            float: left;
            text-align: center;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: "Inter", sans-serif;
            font-weight: 400;
            color: white;
            margin: 0 0 20px 0;
            padding: 30px;
        }

        .layout {
            width: 100%;
            padding: 0 auto;
        }

        .col1,
        .col2 {
            width: 50%;
            padding: 0 auto;
            background-attachment: fixed;
        }

        .col1 {
            /* background-color: #11172f; */
            min-height: 100%;
            position: fixed;
            left: 0;
            right: 0;
            top: 30%;
            z-index: 1;
        }

        .col2 {
            color: white;
            float: right;
            /* background-color: #11172f; */
            left: 0;
            right: 0;
            top: 0;
            z-index: 1;
        }

        #welcome {
            text-align: center;
        }

        #stats {
            text-align: center;
        }

        #about {
            margin: 0 auto;
            width: 100%;
            color: white;
            position: relative;
            text-align: left;
            min-height: 500px;
        }

        #projectwrapper {
            margin: 0 auto;
            width: 100%;
            color: white;
            position: relative;
            text-align: left;
            min-height: 500px;
        }
    </style>

</head>


<body>
    <div class="layout">
        <div class="col1">
            <div id="welcome">
                <h1 class="text-4xl font-bold tracking-tight text-slate-200 sm:text-5xl"
                    style="opacity: 1; filter: blur(0px); transform: none;">Aadarsh Shah</h1>
            </div>

            <div id="stats">
                <h2>Weather: Time: Setting:</h2>
            </div>
        </div>

        <div class="col2">

            <section id="about">
                <div id="intro">
                    <h3>About </h3>
                </div>
            </section>

            <section id="projectwrapper">
                <div id="projects">
                    <h3>Projects </h3>
                    <p>Nothing to show just yet :(</p>
                </div>
            </section>
        </div>

    </div>
</body>

</html>
